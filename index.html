<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Poetry Generator</title>
</head>
<body>
    <center>
        <h1>Poetry Generator</h1>
        <hr>
        <div id="box">
            <p id="content">Choose Your Poetry Gene...</p>
        </div>
        <br><br>
        <button onclick="document.getElementById('content').textContent='गिरकर उठना सीख, हारकर जीतना सीख। वक्त बदलेगा एक दिन, बस खुद पर भरोसा रखना सीख। 💪🔥'">Motivation</button>
        <button onclick="document.getElementById('content').textContent='कुछ दर्द लफ़्ज़ों में बयां नहीं होते,कुछ अपने होकर भी अपने नहीं होते। 💔मुस्कुराना तो आदत बन गई है हमारी,वरना हम भी हर रात सुकून से नहीं सोते। 🥀'">Sad</button>
        <button onclick="document.getElementById('content').textContent='अब खामोश हूँ, तो कमजोर मत समझना, 🔥मेरे सब्र को मेरी हार मत समझना।वक्त आने पर जवाब भी देंगे,बस हर किसी को अपनी औकात बताना ज़रूरी नहीं समझते। 😈💯'">Angery</button>
       <button onclick="document.getElementById('content').textContent='Choose Your Poetry Genre...'">Reset</button>
    </center>
    
</body>
</html>
